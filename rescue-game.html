<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescue the Lost Gear</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b1f;color:#f4f1ff;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 70% 100%,#3a1d4f 0,#0d1233 45%,#070b1f 100%);touch-action:manipulation;user-select:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.6}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;justify-content:space-between;gap:8px;font-size:16px;z-index:5;pointer-events:none}
#hud b{color:#ffb454}
.item{position:absolute;font-size:56px;line-height:1;cursor:pointer;filter:drop-shadow(0 0 10px rgba(255,180,84,.7));will-change:transform}
.item.pop{transition:transform .3s,opacity .3s;opacity:0}
.item span{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:#ffd9a0;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:8px}
#fact{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92%,460px);background:#fff3dc;color:#2a1a0a;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.4;opacity:0;transition:.3s;z-index:6;pointer-events:none;border:3px solid #ff7a3d}
#fact.show{opacity:1;transform:translate(-50%,0)}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(7,11,31,.88);z-index:10;gap:12px}
#panel h1{margin:0;font-size:clamp(26px,7vw,42px);color:#ffb454}
#panel p{margin:0;max-width:420px;line-height:1.5;font-size:17px}
button{font:inherit;font-size:20px;font-weight:700;padding:12px 30px;border:0;border-radius:30px;background:#ff7a3d;color:#fff;cursor:pointer;box-shadow:0 5px 0 #b64a17}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b64a17}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#back{color:#9fc4ff;font-size:15px}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){.item.pop,#fact{transition:none}}
.a{width:1em;height:1em;display:block}</style>
</head>
<body>
<div id="stage">
  <div id="hud"><div>Rescued: <b id="sc">0</b> / 12</div><div>Lost: <b id="lost">0</b> / 5</div><div>Best: <b id="best">0</b></div></div>
  <div id="fact"></div>
  <div id="panel">
    <div style="font-size:72px;width:1em;height:1em"><svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><rect x='4' y='38' width='30' height='24' fill='#3a78d8' stroke='#9fc4ff' stroke-width='2'/><rect x='66' y='38' width='30' height='24' fill='#3a78d8' stroke='#9fc4ff' stroke-width='2'/><rect x='36' y='30' width='28' height='40' rx='5' fill='#dfe3f5' stroke='#6b6f85' stroke-width='3'/><circle cx='50' cy='50' r='7' fill='#ff7a3d'/><line x1='50' y1='30' x2='50' y2='14' stroke='#9aa0c0' stroke-width='3'/><circle cx='50' cy='12' r='4' fill='#7dff9b'/></svg></div>
    <h1>Rescue the Lost Gear</h1>
    <p>Machines we sent to space are drifting away and getting lost. Tap each one to bring it to safety before it floats off the screen!</p>
    <p>Rescue 12 to win. If 5 get lost, the mission ends.</p>
    <button id="go">Start mission</button>
    <a id="back" href="index.html#stories">Back to the stories</a>
  </div>
</div>
<script>
var ART={rover:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 80'><polygon points='6,36 94,36 84,22 16,22' fill='#e2b13a' stroke='#7a5a10' stroke-width='2'/><path d='M30 22 L28 36 M50 22 V36 M70 22 L72 36' stroke='#7a5a10' stroke-width='1.5'/><rect x='26' y='36' width='48' height='16' rx='3' fill='#c9ccd8' stroke='#6b6f85' stroke-width='2'/><rect x='62' y='8' width='3' height='15' fill='#8a8fa8'/><rect x='55' y='3' width='17' height='8' rx='2' fill='#2c3050'/><circle cx='60' cy='7' r='2.5' fill='#7fd6ff'/><circle cx='68' cy='7' r='2.5' fill='#7fd6ff'/><path d='M22 62 L50 52 L78 62' stroke='#6b6f85' stroke-width='3' fill='none'/><g fill='#2a2d45' stroke='#9aa0c0' stroke-width='2'><circle cx='20' cy='64' r='10'/><circle cx='50' cy='66' r='9'/><circle cx='80' cy='64' r='10'/></g><g fill='#9aa0c0'><circle cx='20' cy='64' r='3'/><circle cx='50' cy='66' r='3'/><circle cx='80' cy='64' r='3'/></g></svg>`,rocket:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 60 100'><path d='M30 4 C44 20 46 44 42 72 L18 72 C14 44 16 20 30 4Z' fill='#f2f4ff' stroke='#8c92b8' stroke-width='2'/><path d='M30 4 C36 11 40 18 41 27 L19 27 C20 18 24 11 30 4Z' fill='#e5483b'/><circle cx='30' cy='44' r='8' fill='#4aa8ff' stroke='#556' stroke-width='2'/><circle cx='27' cy='41' r='2.5' fill='#cfeaff'/><path d='M18 58 L5 86 L19 76Z M42 58 L55 86 L41 76Z' fill='#e5483b' stroke='#9a2a20' stroke-width='1.5'/><rect x='22' y='72' width='16' height='5' fill='#6b6f85'/></svg>`,earth:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='#2a6fd6'/><path d='M22 30 C30 18 46 20 44 32 C42 42 30 46 26 56 C18 50 14 38 22 30Z M58 56 C70 50 84 58 80 70 C76 82 62 84 58 74 C54 68 54 60 58 56Z M56 18 C66 14 78 22 72 30 C66 34 56 28 56 18Z' fill='#4fae5a'/><ellipse cx='36' cy='28' rx='14' ry='6' fill='#fff' opacity='.35'/><circle cx='50' cy='50' r='46' fill='none' stroke='#8fc1ff' stroke-width='3'/></svg>`,moon:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='#dcd8cc'/><g fill='#b8b3a4'><circle cx='34' cy='34' r='10'/><circle cx='64' cy='58' r='13'/><circle cx='40' cy='70' r='6'/><circle cx='70' cy='28' r='5'/></g><circle cx='50' cy='50' r='46' fill='none' stroke='#f3f0e4' stroke-width='3'/></svg>`,robot:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><line x1='50' y1='8' x2='50' y2='22' stroke='#9aa0c0' stroke-width='3'/><circle cx='50' cy='8' r='4' fill='#ff7a3d'/><rect x='28' y='22' width='44' height='30' rx='10' fill='#dfe3f5' stroke='#6b6f85' stroke-width='3'/><rect x='34' y='30' width='32' height='14' rx='7' fill='#1b1f45'/><circle cx='43' cy='37' r='4' fill='#7dff9b'/><circle cx='57' cy='37' r='4' fill='#7dff9b'/><rect x='34' y='54' width='32' height='18' rx='5' fill='#c9ccd8' stroke='#6b6f85' stroke-width='3'/><path d='M34 60 L18 72 M66 60 L82 72' stroke='#9aa0c0' stroke-width='4' stroke-linecap='round'/><g fill='#2a2d45' stroke='#9aa0c0' stroke-width='2'><circle cx='36' cy='84' r='11'/><circle cx='64' cy='84' r='11'/></g></svg>`,reflector:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><path d='M30 90 L50 55 L70 90' stroke='#8a8fa8' stroke-width='4' fill='none'/><rect x='20' y='14' width='60' height='44' rx='4' fill='#aab0cc' stroke='#5b6082' stroke-width='3'/><g fill='#e8f4ff' stroke='#5b6082' stroke-width='1.5'><circle cx='34' cy='28' r='7'/><circle cx='50' cy='28' r='7'/><circle cx='66' cy='28' r='7'/><circle cx='34' cy='44' r='7'/><circle cx='50' cy='44' r='7'/><circle cx='66' cy='44' r='7'/></g></svg>`,sign:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><rect x='47' y='50' width='6' height='46' fill='#8a8fa8'/><rect x='14' y='12' width='72' height='46' rx='5' fill='#e0c779' stroke='#7a6420' stroke-width='3'/><g stroke='#7a6420' stroke-width='3' stroke-linecap='round'><line x1='26' y1='26' x2='74' y2='26'/><line x1='26' y1='36' x2='74' y2='36'/><line x1='26' y1='46' x2='58' y2='46'/></g></svg>`,foot:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><g fill='#c8c5d6' stroke='#5b5f80' stroke-width='3'><path d='M34 14 C54 8 66 24 62 44 C60 58 40 60 34 48 C28 36 26 20 34 14Z'/><path d='M36 66 C48 62 62 68 60 80 C58 92 40 94 36 84 C34 78 32 70 36 66Z'/></g><g stroke='#5b5f80' stroke-width='3'><line x1='40' y1='26' x2='56' y2='24'/><line x1='40' y1='36' x2='57' y2='34'/></g></svg>`,sat:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><rect x='4' y='38' width='30' height='24' fill='#3a78d8' stroke='#9fc4ff' stroke-width='2'/><rect x='66' y='38' width='30' height='24' fill='#3a78d8' stroke='#9fc4ff' stroke-width='2'/><rect x='36' y='30' width='28' height='40' rx='5' fill='#dfe3f5' stroke='#6b6f85' stroke-width='3'/><circle cx='50' cy='50' r='7' fill='#ff7a3d'/><line x1='50' y1='30' x2='50' y2='14' stroke='#9aa0c0' stroke-width='3'/><circle cx='50' cy='12' r='4' fill='#7dff9b'/></svg>`,boom:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><polygon points='50,2 61,32 94,22 72,48 98,70 64,70 58,98 46,72 14,90 28,58 4,40 38,36' fill='#ffb454' stroke='#ff5a2d' stroke-width='3'/><polygon points='50,24 57,42 76,38 62,52 74,66 54,62 50,78 44,62 26,70 38,52 24,40 44,42' fill='#fff3a0'/></svg>`,flame:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 30 50'><path d='M15 2 C26 18 28 32 22 42 C18 48 12 48 8 42 C2 32 4 18 15 2Z' fill='#ff7a3d'/><path d='M15 18 C21 28 22 36 18 42 C16 44 14 44 12 42 C8 36 10 28 15 18Z' fill='#ffe36b'/></svg>`,spark:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><path d='M50 4 C54 36 64 46 96 50 C64 54 54 64 50 96 C46 64 36 54 4 50 C36 46 46 36 50 4Z' fill='#ffe9a0' stroke='#ffb454' stroke-width='3'/></svg>`,alert:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='#ff4d4d' stroke='#fff' stroke-width='5'/><rect x='44' y='22' width='12' height='34' rx='5' fill='#fff'/><circle cx='50' cy='72' r='7' fill='#fff'/></svg>`,vr:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><path d='M8 44 C8 30 20 24 30 24 L70 24 C80 24 92 30 92 44 L92 56 C92 70 80 76 70 76 L60 76 L54 64 L46 64 L40 76 L30 76 C20 76 8 70 8 56Z' fill='#e9ecff' stroke='#6b6f85' stroke-width='3'/><rect x='16' y='34' width='68' height='30' rx='12' fill='#1b1f45'/><circle cx='36' cy='49' r='7' fill='#7dd6ff'/><circle cx='64' cy='49' r='7' fill='#7dd6ff'/></svg>`,rock:`<svg xmlns='http://www.w3.org/2000/svg' class='a' width='100' height='100' viewBox='0 0 100 100'><path d='M8 86 L18 48 L40 28 L66 34 L88 58 L92 86Z' fill='#6e4630' stroke='#3d2418' stroke-width='3'/><path d='M40 28 L44 52 L66 34 M18 48 L44 52 L56 86' stroke='#3d2418' stroke-width='2' fill='none'/><path d='M22 52 L40 32 L44 48Z' fill='#8d5d40'/></svg>`};(function(){
var stage=document.getElementById("stage"),panel=document.getElementById("panel"),
sc=document.getElementById("sc"),lostEl=document.getElementById("lost"),bestEl=document.getElementById("best"),
fact=document.getElementById("fact"),go=document.getElementById("go");
var ITEMS=[
[ART.rover,"Opportunity","Opportunity landed on Mars in 2004 and kept going for almost 15 years, far longer than planned."],
[ART.rocket,"Able 1","Able 1 was a 1958 Moon probe. It never reached space for long because its rocket failed after launch."],
[ART.reflector,"Laser Reflector","Apollo 11 left a laser mirror on the Moon in 1969. Scientists still bounce lasers off it to measure the distance."],
[ART.sign,"Plaque","An Apollo 15 plaque on the Moon carries names of astronauts and cosmonauts who died. It honors them."],
[ART.foot,"Footprint","Footprints on the Moon can last for millions of years, because there is no wind or rain to erase them."]
];
var best=0;try{best=+localStorage.getItem("rescueBest")||0}catch(e){}
bestEl.textContent=best;
for(var i=0;i<60;i++){var s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.opacity=.2+Math.random()*.6;stage.insertBefore(s,stage.firstChild)}
var list,score,lost,running,last,spawnT,factT;
function showFact(t){fact.textContent=t;fact.classList.add("show");clearTimeout(factT);factT=setTimeout(function(){fact.classList.remove("show")},3500)}
function spawn(){
  var d=ITEMS[Math.floor(Math.random()*ITEMS.length)],el=document.createElement("div");
  el.className="item";el.innerHTML=d[0]+"<span>"+d[1]+"</span>";
  var W=stage.clientWidth,H=stage.clientHeight,side=Math.floor(Math.random()*4),x,y,vx,vy,sp=40+Math.random()*30+score*3;
  if(side==0){x=Math.random()*W;y=-60;vx=(Math.random()-.5)*40;vy=sp}
  else if(side==1){x=Math.random()*W;y=H+10;vx=(Math.random()-.5)*40;vy=-sp}
  else if(side==2){x=-60;y=80+Math.random()*(H-200);vx=sp;vy=(Math.random()-.5)*40}
  else{x=W+10;y=80+Math.random()*(H-200);vx=-sp;vy=(Math.random()-.5)*40}
  var o={el:el,x:x,y:y,vx:vx,vy:vy,r:0,vr:(Math.random()-.5)*60,d:d,seen:false};
  el.addEventListener("pointerdown",function(ev){ev.preventDefault();rescue(o)});
  stage.appendChild(el);list.push(o)
}
function rescue(o){
  if(!running||o.dead)return;o.dead=true;score++;sc.textContent=score;
  o.el.classList.add("pop");o.el.style.transform="translate("+o.x+"px,"+o.y+"px) scale(1.8)";
  setTimeout(function(){o.el.remove()},300);showFact(o.d[2]);
  if(score>=12)end(true)
}
function end(win){
  running=false;list.forEach(function(o){o.el.remove()});
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("rescueBest",best)}catch(e){}}
  panel.querySelector("h1").textContent=win?"Mission complete!":"Mission over";
  var p=panel.querySelectorAll("p");
  p[0].textContent=win?"You rescued 12 pieces of lost gear. Real space is still full of forgotten machines, so every story counts.":"Too many machines drifted away. That is what happens to real tools left in space. Try again!";
  p[1].textContent="You rescued "+score+" this time.";
  go.textContent="Play again";panel.classList.remove("hidden");fact.classList.remove("show")
}
function tick(t){
  if(!running)return;var dt=Math.min((t-last)/1000,.05);last=t;
  var W=stage.clientWidth,H=stage.clientHeight;
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.5,1.4-score*.06)}
  for(var i=list.length-1;i>=0;i--){
    var o=list[i];if(o.dead){list.splice(i,1);continue}
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.r+=o.vr*dt;
    o.el.style.transform="translate("+o.x+"px,"+o.y+"px) rotate("+o.r+"deg)";
    var inside=o.x>-40&&o.x<W-10&&o.y>-40&&o.y<H-10;
    if(inside)o.seen=true;
    if(o.seen&&(o.x<-80||o.x>W+30||o.y<-80||o.y>H+30)){
      o.dead=true;o.el.remove();list.splice(i,1);lost++;lostEl.textContent=lost;
      showFact(o.d[1]+" drifted away and is lost in space.");
      if(lost>=5){end(false);return}
    }
  }
  requestAnimationFrame(tick)
}
go.onclick=function(){
  list=[];score=0;lost=0;sc.textContent=0;lostEl.textContent=0;spawnT=.3;
  panel.classList.add("hidden");running=true;last=performance.now();requestAnimationFrame(tick)
};
})();
</script>
</body>
</html>
