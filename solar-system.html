<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar system | Abandoned Tools in Space</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <header>
    <h1>One way to space: The Story of Space Exploration and Abandoned Tools in space</h1>
    <nav aria-label="Main">
      <a href="index.html#stories">Stories</a>
      <a href="solar-system.html" aria-current="page">Solar system</a>
      <a href="mission-log.html">Mission log</a>
      <a href="leaderboard.html">Leaderboard</a>
    </nav>
  </header>
  <main>
    <h2>Solar system</h2>
    <p class="section-note">Choose a planet from the list, or select one in the picture. Sizes and distances are not to scale.</p>
    <div class="explorer">
      <ul class="chooser" id="chooser"></ul>
      <div class="stage">
        <svg id="orbits" viewBox="0 0 520 520" role="group" aria-label="Solar system diagram, not to scale"></svg>
        <button type="button" class="pill" id="toggle" aria-pressed="false">Pause orbits</button>
      </div>
      <aside class="panel" id="info" aria-live="polite"></aside>
    </div>
  </main>
  <footer><p>&copy; 2026 My Website</p></footer>
  <script src="script.js"></script>
  <script>
const P=[
['Mercury',36,4,'#9a9a9a',.24,'0.39 AU','88 days','The smallest planet, and the closest to the Sun.'],
['Venus',56,6,'#e3b26b',.62,'0.72 AU','225 days','The hottest planet, wrapped in thick clouds.'],
['Earth',76,6.5,'#4a90e2',1,'1 AU','365 days','Our home, and the only planet known to have life.'],
['Mars',98,5,'#d9593b',1.88,'1.52 AU','687 days','A cold, dusty planet. The rover Opportunity was left here.','<a href="story-1.html">Read the Opportunity story</a>'],
['Jupiter',140,13,'#d8b48a',11.86,'5.2 AU','About 12 years','The biggest planet. Its Great Red Spot is a giant storm.'],
['Saturn',178,11,'#e2c88f',29.5,'9.58 AU','About 29 years','Famous for its rings of ice and rock.'],
['Uranus',212,8,'#8fd3e0',84,'19.2 AU','84 years','It spins on its side.'],
['Neptune',244,8,'#4a6fe3',165,'30.1 AU','165 years','The farthest planet: cold and windy.']];
const svg=document.getElementById('orbits'),NS='http://www.w3.org/2000/svg',C=260,list=document.getElementById('chooser'),info=document.getElementById('info');
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e};
mk('circle',{cx:C,cy:C,r:16,fill:'#f5b93a'});
const st=P.map((p,i)=>{
  mk('circle',{cx:C,cy:C,r:p[1],fill:'none',stroke:'#22304a'});
  const d=mk('circle',{r:p[2],fill:p[3],class:'planet',tabindex:0,role:'button','aria-label':p[0]});
  d.addEventListener('click',()=>pick(i));
  d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(i)}});
  const li=document.createElement('li');li.innerHTML='<button type="button" class="choice">'+p[0]+'<small>'+p[5]+' from Sun</small></button>';
  li.firstChild.addEventListener('click',()=>pick(i));list.appendChild(li);
  return {d,b:li.firstChild,a:Math.random()*6.28};
});
function pick(i){
  const p=P[i];
  st.forEach((s,j)=>{s.b.setAttribute('aria-current',j===i);s.d.dataset.on=j===i?1:0});
  info.innerHTML='<h3>'+p[0]+'</h3><dl><dt>From the Sun</dt><dd>'+p[5]+'</dd><dt>One year</dt><dd>'+p[6]+'</dd></dl><p>'+p[7]+'</p>'+(p[8]?'<p>'+p[8]+'</p>':'')+'<p><small>1 AU is the distance from Earth to the Sun.</small></p>';
}
let run=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const btn=document.getElementById('toggle');
const label=()=>{btn.textContent=run?'Pause orbits':'Play orbits';btn.setAttribute('aria-pressed',!run)};
btn.addEventListener('click',()=>{run=!run;label()});label();
(function tick(t){
  const dt=t-last;last=t;
  st.forEach((s,i)=>{if(run)s.a+=dt*.00008/Math.sqrt(P[i][4]);s.d.setAttribute('cx',C+P[i][1]*Math.cos(s.a));s.d.setAttribute('cy',C+P[i][1]*Math.sin(s.a))});
  requestAnimationFrame(tick);
})(0);
pick(3);
  </script>
</body>
</html>
